<!DOCTYPE html>
<html>
<head>
  <title>Gate Entry</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      background: #000;
      color: white;
      padding: 15px;
    }

    .box {
      background: #fff;
      color: black;
      padding: 20px;
      max-width: 400px;
      margin: auto;
      border-radius: 10px;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
    }
  </style>
</head>

<body>

<div class="box">
  <h3>Gate Entry</h3>

  <form id="form">

    <input type="date" id="date" required>
    <input type="time" id="time" required>

    <input type="text" id="challan" placeholder="Challan No" required>
    <input type="text" id="item" placeholder="Item">

    <input type="number" id="quantity" placeholder="Quantity">

    <select id="unit">
      <option>Nos</option>
      <option>PKT</option>
      <option>Bags</option>
    </select>

    <input type="text" id="vehicle" placeholder="Vehicle">
    <input type="text" id="driver" placeholder="Driver">

    <select id="location">
      <option>SFGPL</option>
      <option>Biofuel</option>
    </select>

    <button type="submit">Submit</button>

  </form>

</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwjVZ6A3z9nzaOfHoMJthcN_1O3dooZCv807nlgiZJaMYurEGducaImRj4TZMlolz3_uA/exec";

// Auto Date Time
window.onload = () => {
  const now = new Date();
  document.getElementById("date").value = now.toISOString().split("T")[0];
  document.getElementById("time").value = now.toTimeString().slice(0,5);
};

// Token Generate
function generateToken() {
  return Math.floor(100000 + Math.random() * 900000);
}

document.getElementById("form").addEventListener("submit", function(e){
  e.preventDefault();

  const token = generateToken();

  const data = {
    token: token,
    date: document.getElementById("date").value,
    time: document.getElementById("time").value,
    challan: document.getElementById("challan").value,
    item: document.getElementById("item").value,
    quantity: document.getElementById("quantity").value,
    unit: document.getElementById("unit").value,
    vehicle: document.getElementById("vehicle").value,
    driver: document.getElementById("driver").value,
    location: document.getElementById("location").value
  };

  fetch(SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    body: JSON.stringify(data)
  });

  alert("Saved ✅ Token: " + token);
  document.getElementById("form").reset();
});
</script>

</body>
</html>
