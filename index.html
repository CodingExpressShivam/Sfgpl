<!DOCTYPE html>
<html>
<head>
  <title>Gate Entry</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      background: #000;
      color: white;
      padding: 15px;
    }

    .box {
      background: #fff;
      color: black;
      padding: 20px;
      max-width: 400px;
      margin: auto;
      border-radius: 10px;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
    }

    button {
      background: green;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: darkgreen;
    }

    a {
      color: yellow;
    }
  </style>
</head>

<body>

  <a href="receive.html">➡️ Go to Receive Entry</a>
  <h1>V.2.3</h1>

  <div class="box">
    <h3>Gate Entry</h3>

    <form id="form">

      <input type="date" id="date" required>
      <input type="time" id="time" required>

      <input type="text" id="item" placeholder="Item Description" required>
      <input type="number" id="quantity" placeholder="Quantity" required>

      <select id="unit">
        <option>Nos</option>
        <option>Packet</option>
        <option>Bags</option>
        <option>Liter</option>
      </select>

      <input type="text" id="vehicle" placeholder="Vehicle Number">
      <input type="text" id="driver" placeholder="Driver Name">

      <select id="location" required>
        <option value="">Select Location</option>
        <option>SFGPL Sand to BioFuel</option>
        <option>BioFuel Sand to SFGPL</option>
        <option>SFGPL Received</option>
        <option>BioFuel Received</option>
      </select>

      <button type="submit">Submit</button>

    </form>
  </div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzSORXA_91sZJz0ZlHD-DvlhFj2uRVwc3clnShidx8qC1fhUIXxhVB-1LYmW-joGr2K/exec";

// 🔢 Token generator
function generateToken() {
  return Math.floor(100000 + Math.random() * 900000);
}

// 📤 Form submit
document.getElementById("form").addEventListener("submit", function(e){
  e.preventDefault();

  const token = generateToken();

  const data = {
    token: token,
    date: document.getElementById("date").value,
    time: document.getElementById("time").value,
    item: document.getElementById("item").value,
    quantity: document.getElementById("quantity").value,
    unit: document.getElementById("unit").value,
    vehicle: document.getElementById("vehicle").value,
    driver: document.getElementById("driver").value,
    location: document.getElementById("location").value
  };

  fetch(SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify(data)
  })
  .then(res => res.text())
  .then(res => {
    alert("✅ Saved Successfully\nToken: " + token);
    document.getElementById("form").reset();
  })
  .catch(err => {
    alert("❌ Error: " + err);
  });
});
</script>

</body>
</html>
