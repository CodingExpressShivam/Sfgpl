<!DOCTYPE html>
<html>
<head>
  <title>Gate Entry</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      padding: 20px;
      text-align: center;
    }

    /* 🔥 TOP BUTTON */
    .top-btn {
      display: block;
      width: 100%;
      max-width: 420px;
      margin: auto;
      margin-bottom: 15px;
      padding: 15px;
      background: #2563eb;
      color: white;
      font-size: 18px;
      font-weight: bold;
      border-radius: 10px;
      text-decoration: none;
    }

    .top-btn:hover {
      background: #1d4ed8;
    }

    .container {
      background: white;
      color: black;
      max-width: 420px;
      margin: auto;
      padding: 45px;
      border-radius: 12px;
    }

    input, select {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #16a34a;
      color: white;
      margin-top: 10px;
    }

    button:hover {
      background: #15803d;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row input {
      flex: 1;
    }

  </style>
</head>

<body>

<h1>🚪 Gate Entry</h1>

<!-- 🔥 TOP RECEIVE BUTTON -->
<a href="receive.html" class="top-btn">📦 GO TO RECEIVE ENTRY</a>

<div class="container">

  <form id="form">

    <div class="row">
      <input type="date" id="date" required>
      <input type="time" id="time" required>
    </div>

    <input type="text" id="item" placeholder="Item Description" required>
    <input type="number" id="quantity" placeholder="Quantity" required>

    <select id="unit">
      <option>Nos</option>
      <option>Packet</option>
      <option>Bags</option>
      <option>Liter</option>
    </select>

    <input type="text" id="vehicle" placeholder="Vehicle Number">
    <input type="text" id="driver" placeholder="Driver Name">

    <select id="location" required>
      <option value="">Select Location</option>
      <option>SFGPL Sand to BioFuel</option>
      <option>BioFuel Sand to SFGPL</option>
      <option>SFGPL Received</option>
      <option>BioFuel Received</option>
    </select>

    <button type="submit">✅ SAVE ENTRY</button>

  </form>

</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzSORXA_91sZJz0ZlHD-DvlhFj2uRVwc3clnShidx8qC1fhUIXxhVB-1LYmW-joGr2K/exec";

function generateToken() {
  return Math.floor(100000 + Math.random() * 900000);
}

document.getElementById("form").addEventListener("submit", function(e){
  e.preventDefault();

  const token = generateToken();

  const data = {
    token: token,
    date: document.getElementById("date").value,
    time: document.getElementById("time").value,
    item: document.getElementById("item").value,
    quantity: document.getElementById("quantity").value,
    unit: document.getElementById("unit").value,
    vehicle: document.getElementById("vehicle").value,
    driver: document.getElementById("driver").value,
    location: document.getElementById("location").value
  };

  fetch(SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify(data)
  })
  .then(res => res.text())
  .then(() => {
    alert("✅ Saved\nToken: " + token);
    document.getElementById("form").reset();
  });
});
</script>

</body>
</html>
