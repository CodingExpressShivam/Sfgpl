<!DOCTYPE html>
<html>
<head>
  <title>Receive Entry</title>
</head>
<body>

<h2>Gate Receive System v2</h2>

<input type="text" id="token" placeholder="Enter Token Number">
<button onclick="searchToken()">Search</button>

<div id="result"></div>

<script>
const URL = "https://script.google.com/macros/s/AKfycbx6ypfjsz7mMKizfZKl4Hurl94vTneKlhY3Z8GXqz-eHP2-ekU8gbFhdHAn4adPvAW5/exec";

let currentRow = "";

// 🔍 SEARCH
function searchToken() {
  let token = document.getElementById("token").value;

  fetch(URL + "?search=" + token)
    .then(res => res.json())
    .then(data => {
      console.log(data);

      if (!data.found) {
        document.getElementById("result").innerHTML = "❌ Not Found";
      } else {
        currentRow = data.rowIndex;

        document.getElementById("result").innerHTML = `
          <b>Item:</b> ${data.row[3]} <br>
          <b>Quantity:</b> ${data.row[4]} <br>
          <b>Vehicle:</b> ${data.row[6]} <br>
          <b>Driver:</b> ${data.row[7]} <br><br>

          <button onclick="markReceived()">✅ Mark Received</button>
        `;
      }
    });
}

// 📦 UPDATE
function markReceived() {
  console.log("Row:", currentRow);

  fetch(URL, {
    method: "POST",
    mode: "no-cors", // 👈 IMPORTANT (CORS fix)
    body: JSON.stringify({
      action: "receive",
      row: Number(currentRow)
    })
  })
  .then(() => {
    alert("✅ Received (Check Sheet)");
    location.reload();
  })
  .catch(err => {
    alert("Error: " + err);
  });
}
</script>

</body>
</html>
