<!DOCTYPE html>
<html>
<head>
  <title>Receive Entry</title>
</head>
<body>

<h2>Gate Receive System</h2>

<input type="text" id="token" placeholder="Enter Token Number">
<button onclick="searchToken()">Search</button>

<div id="result"></div>

<script>
let currentRow = "";

function searchToken() {
  let token = document.getElementById("token").value;

  fetch("https://script.google.com/macros/s/AKfycbzSORXA_91sZJz0ZlHD-DvlhFj2uRVwc3clnShidx8qC1fhUIXxhVB-1LYmW-joGr2K/exec" + token)
    .then(res => res.json())
    .then(data => {
      if (data.error) {
        document.getElementById("result").innerHTML = "Not Found";
      } else {
        currentRow = data.row;
        document.getElementById("result").innerHTML = `
          Item: ${data.item} <br>
          Quantity: ${data.quantity} <br>
          Vehicle: ${data.vehicle} <br>
          Driver: ${data.driver} <br><br>
          <button onclick="markReceived()">Mark Received</button>
        `;
      }
    });
}

function markReceived() {
  google.script.run.withSuccessHandler(() => {
    alert("Received Successfully");
    location.reload();
  }).markReceived(currentRow);
}
</script>

</body>
</html>
