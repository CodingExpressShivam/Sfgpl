<!DOCTYPE html>
<html>
<head>
  <title>Receive Entry</title>
</head>
<body>

<h2>Gate Receive System</h2>

<input type="text" id="token" placeholder="Enter Token Number">
<button onclick="searchToken()">Search</button>

<div id="result"></div>

<script>
const URL = "https://script.google.com/macros/s/AKfycbzSORXA_91sZJz0ZlHD-DvlhFj2uRVwc3clnShidx8qC1fhUIXxhVB-1LYmW-joGr2K/exec";

let currentRow = "";

// SEARCH
function searchToken() {
  let token = document.getElementById("token").value;

  fetch(URL + "?search=" + token)
    .then(res => res.json())
    .then(data => {
      if (!data.found) {
        document.getElementById("result").innerHTML = "❌ Not Found";
      } else {
        currentRow = data.rowIndex;

        document.getElementById("result").innerHTML = `
          <b>Item:</b> ${data.row[3]} <br>
          <b>Quantity:</b> ${data.row[4]} <br>
          <b>Vehicle:</b> ${data.row[6]} <br>
          <b>Driver:</b> ${data.row[7]} <br><br>

          <button onclick="markReceived()">✅ Mark Received</button>
        `;
      }
    });
}

// UPDATE
function markReceived() {
  fetch(URL, {
    method: "POST",
    body: JSON.stringify({
      action: "receive",
      row: currentRow
    })
  })
  .then(res => res.text())
  .then(data => {
    alert(data); // 👈 "Updated" dikhega
    location.reload();
  });
}
</script>

</body>
</html>
