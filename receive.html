<!DOCTYPE html>
<html>
<head>
  <title>Receive Entry</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      background: #000;
      color: white;
      padding: 15px;
    }

    .box {
      background: #fff;
      color: black;
      padding: 20px;
      max-width: 400px;
      margin: auto;
      border-radius: 10px;
    }

    input, button, select {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
    }

    .result {
      background: #f4f4f4;
      padding: 10px;
      border-radius: 5px;
    }
  </style>
</head>

<body>

<div class="box">

  <h3>Receive Entry</h3>

  <input type="text" id="token" placeholder="Enter Token Number">
  <button onclick="search()">Search</button>

  <div id="result" class="result"></div>

  <div id="updateBox" style="display:none;">
    <select id="status">
      <option value="">Select Status</option>
      <option>Received by BioFuel</option>
      <option>Received by SFGPL</option>
    </select>

    <button onclick="update()">Submit</button>
  </div>

  <br>
  <a href="index.html">⬅ Back</a>

</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwjVZ6A3z9nzaOfHoMJthcN_1O3dooZCv807nlgiZJaMYurEGducaImRj4TZMlolz3_uA/exec";

let rowNumber = null;

// 🔍 SEARCH DATA
function search() {
  const token = document.getElementById("token").value;

  fetch(SCRIPT_URL + "?search=" + token)
    .then(res => res.json())
    .then(data => {
      if (data.found) {

        rowNumber = data.index;

        document.getElementById("result").innerHTML = `
          <p><b>Token:</b> ${data.row[0]}</p>
          <p><b>Date:</b> ${data.row[1]}</p>
          <p><b>Item:</b> ${data.row[3]}</p>
          <p><b>Quantity:</b> ${data.row[4]}</p>
        `;

        document.getElementById("updateBox").style.display = "block";

      } else {
        document.getElementById("result").innerHTML = "❌ Data Not Found";
        document.getElementById("updateBox").style.display = "none";
      }
    });
}

// 📝 UPDATE STATUS
function update() {
  const status = document.getElementById("status").value;

  if (!status) {
    alert("Select status first");
    return;
  }

  fetch(SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    body: JSON.stringify({
      row: rowNumber,
      status: status
    })
  });

  alert("✅ Updated Successfully");
}
</script>

</body>
</html>
