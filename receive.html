<!DOCTYPE html>
<html>
<head>
  <title>Receive Entry</title>
</head>
<body>

<h2>Gate Receive System</h2>

<input type="text" id="token" placeholder="Enter Token Number">
<button onclick="searchToken()">Search</button>

<div id="result"></div>

<script>
const URL = "YOUR_WEB_APP_URL"; // 👈 replace karo

let currentRow = "";

// 🔍 SEARCH
function searchToken() {
  let token = document.getElementById("token").value;

  fetch(URL + "?search=" + token)
    .then(res => res.json())
    .then(data => {
      if (!data.found) {
        document.getElementById("result").innerHTML = "❌ Not Found";
      } else {
        currentRow = data.rowIndex;

        document.getElementById("result").innerHTML = `
          <b>Item:</b> ${data.row[3]} <br>
          <b>Quantity:</b> ${data.row[4]} <br>
          <b>Vehicle:</b> ${data.row[6]} <br>
          <b>Driver:</b> ${data.row[7]} <br><br>

          <input id="receiver" placeholder="Receiver Name"><br><br>
          <input id="remark" placeholder="Remark"><br><br>

          <button onclick="markReceived()">✅ Mark Received</button>
        `;
      }
    });
}

// ✅ UPDATE
function markReceived() {
  let receiver = document.getElementById("receiver").value;
  let remark = document.getElementById("remark").value;

  if (!receiver) {
    alert("Receiver name required");
    return;
  }

  fetch(URL, {
    method: "POST",
    body: JSON.stringify({
      action: "receive",
      row: currentRow,
      receiver: receiver,
      remark: remark
    })
  })
  .then(res => res.text())
  .then(data => {
    alert("✅ " + data);
    location.reload();
  });
}
</script>

</body>
</html>
