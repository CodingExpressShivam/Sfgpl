<!DOCTYPE html>
<html>
<head>
  <title>Receive Entry</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .container {
      background: white;
      color: black;
      padding: 20px;
      max-width: 400px;
      margin: auto;
      border-radius: 10px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      background: #16a34a;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #15803d;
    }

    .card {
      background: #f1f5f9;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
      text-align: left;
    }
    .footer {
    position: fixed;
    bottom: 10px;
    width: 100%;
    text-align: center;
    color: #aaa;
    font-size: 14px;
}
  </style>

</head>
<body>

<h2>🚪Gate Receive System</h2>

<div class="container">

  <input type="text" id="token" placeholder="Enter Token Number">
  <button onclick="searchToken()">🔍 Search</button>

  <div id="result"></div>

</div>

<script>
const URL = "https://script.google.com/macros/s/AKfycbwE_kwHgklbMfzI8zbpNzociPDclWxM4hSBSHBQ4NXz_lu-sUTtzerMeurQwupc-YbS/exec";

let currentRow = "";

// 🔍 SEARCH
function searchToken() {
  let token = document.getElementById("token").value;

  fetch(URL + "?search=" + token)
    .then(res => res.json())
    .then(data => {
      if (!data.found) {
        document.getElementById("result").innerHTML = "❌ Not Found";
      } else {
        currentRow = data.rowIndex;

        document.getElementById("result").innerHTML = `
          <div class="card">
            <b>Item:</b> ${data.row[3]} <br>
            <b>Quantity:</b> ${data.row[4]} <br>
            <b>Vehicle:</b> ${data.row[6]} <br>
            <b>Driver:</b> ${data.row[7]} <br><br>

            <input id="receiver" placeholder="Receiver Name">
            <input id="remark" placeholder="Remark">

            <button onclick="markReceived()">✅ Mark Received</button>
          </div>
        `;
      }
    });
}

// ✅ UPDATE
function markReceived() {
  let receiver = document.getElementById("receiver").value;
  let remark = document.getElementById("remark").value;

  if (!receiver) {
    alert("Receiver name required");
    return;
  }

  fetch(URL, {
    method: "POST",
    body: JSON.stringify({
      action: "receive",
      row: currentRow,
      receiver: receiver,
      remark: remark
    })
  })
  .then(res => res.text())
  .then(data => {
    alert("✅ " + data);
    location.reload();
  });
}
</script>
  <div class="footer">
  Developed by Shivam Saini
</div>

</body>
</html>
