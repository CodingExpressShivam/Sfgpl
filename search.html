<!DOCTYPE html>
<html>
<head>
  <title>Search</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body { font-family: Arial; padding: 15px; }
    .box { max-width: 400px; margin: auto; }
    input, button { width: 100%; padding: 10px; margin: 8px 0; }
  </style>
</head>

<body>

<div class="box">
  <h3>Search</h3>

  <input type="text" id="search" placeholder="Enter Token / Challan">
  <button onclick="search()">Search</button>

  <div id="result"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwjVZ6A3z9nzaOfHoMJthcN_1O3dooZCv807nlgiZJaMYurEGducaImRj4TZMlolz3_uA/exec";

function search() {
  const val = document.getElementById("search").value;

  fetch(SCRIPT_URL + "?search=" + val)
    .then(res => res.json())
    .then(data => {
      if (data.found) {
        document.getElementById("result").innerHTML = `
          <p>Token: ${data.row[0]}</p>
          <p>Date: ${data.row[1]}</p>
          <p>Challan: ${data.row[3]}</p>
          <p>Item: ${data.row[4]}</p>
        `;
      } else {
        document.getElementById("result").innerHTML = "Not Found";
      }
    });
}
</script>

</body>
</html>
